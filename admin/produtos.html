<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Produtos — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/lodjastore/css/loja.css">
  <link rel="stylesheet" href="/lodjastore/css/admin-ui.css">
  <link rel="icon" href="/lodjastore/logo-lodja.png">
  <style>
    .form-group{margin-bottom:12px}
    .form-group label{display:block;font-size:12px;font-weight:700;color:#64748b;margin-bottom:4px}
    .form-control{width:100%;border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px;background:#fff}
    .upload-zone{border:2px dashed #c7d2fe;border-radius:14px;padding:16px;text-align:center;color:#64748b;cursor:pointer;background:#f8fafc}
    .img-upload-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
    .img-upload-item{width:72px;height:72px;border-radius:10px;overflow:hidden;position:relative}
    .img-upload-item img{width:100%;height:100%;object-fit:cover}
  </style>
</head>
<body class="admin-pro">
  <header class="adm-top">
    <div class="adm-top-row">
      <div class="adm-brand">
        <button type="button" class="adm-icon-btn" onclick="toggleMenu()">☰</button>
        <div><strong>Produtos</strong><small>Admin Loja</small></div>
      </div>
      <div class="adm-top-actions"><a class="adm-icon-btn" href="index.html">🏠</a></div>
    </div>
  </header>
  <div class="adm-drawer" id="drawer">
    <div class="scrim" onclick="toggleMenu()"></div>
    <div class="panel">
      <a href="index.html">📊 Dashboard</a>
      <a href="produtos.html" class="active">👕 Produtos</a>
      <a href="categorias.html">📂 Categorias</a>
      <a href="pedidos.html">📦 Pedidos</a>
      <a href="relatorios.html">📈 Relatórios</a>
      <a href="promocoes.html">🏷️ Promoções</a>
      <a href="configuracoes.html">⚙️ Configurações</a>
      <a href="/lodjastore/index.html">🏠 Ver loja</a>
      <a href="#" onclick="if(confirm('Sair?'))AdminAuth.logout();return false">🚪 Sair</a>
    </div>
  </div>
  <div class="adm-shell">
    <a class="adm-back" href="index.html">← Voltar</a>
    <div class="adm-page-head">
      <div class="ico">📦</div>
      <div><h1>Produtos</h1><p>Gerencie os produtos da sua loja.</p></div>
    </div>
    <div class="adm-actions-row">
      <button type="button" class="adm-btn adm-btn-primary" onclick="novo()">+ Novo produto</button>
      <a class="adm-btn adm-btn-ghost" href="relatorios.html">📊 Relatórios</a>
    </div>
    <div class="adm-toolbar">
      <div class="adm-search"><span>🔍</span><input id="q" placeholder="Pesquisar produto…" oninput="filtrar()"></div>
    </div>
    <div id="formBox" class="adm-card" style="display:none">
      <h3 id="formTitle" style="margin:0 0 10px">Novo produto</h3>
      <div class="form-group"><label>Nome *</label><input class="form-control" id="fNome"></div>
      <div class="form-group"><label>Categoria</label><select class="form-control" id="fCat"></select></div>
      <div class="form-group"><label>Código</label><input class="form-control" id="fCodigo"></div>
      <div class="form-group"><label>Descrição</label><textarea class="form-control" id="fDesc" rows="2"></textarea></div>
      <div class="form-group"><label>Preço (MT)</label><input class="form-control" id="fPreco" type="number" min="0"></div>
      <div class="form-group"><label>Preço promocional</label><input class="form-control" id="fPromo" type="number" min="0"></div>
      <div class="form-group">
        <label>📷 Imagens do dispositivo</label>
        <div class="upload-zone" onclick="document.getElementById('fFiles').click()">Toque para escolher fotos</div>
        <input type="file" id="fFiles" accept="image/*" multiple hidden>
        <div class="img-upload-grid" id="imgPreview"></div>
      </div>
      <div class="form-group"><label>URL imagem 1</label><input class="form-control" id="fImg1"></div>
      <div class="form-group"><label>URL imagem 2</label><input class="form-control" id="fImg2"></div>
      <div class="form-group"><label>Tamanhos (vírgula)</label><input class="form-control" id="fTam" placeholder="36,38,40"></div>
      <div class="form-group"><label>Cores (vírgula)</label><input class="form-control" id="fCor" placeholder="Azul,Preto"></div>
      <label><input type="checkbox" id="fDest"> Destaque</label>
      &nbsp;<label><input type="checkbox" id="fTend"> Tendência</label>
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="adm-btn adm-btn-primary" type="button" onclick="guardar()">Guardar</button>
        <button class="adm-btn adm-btn-ghost" type="button" onclick="document.getElementById('formBox').style.display='none'">Cancelar</button>
      </div>
      <input type="hidden" id="fId">
    </div>
    <div id="lista"></div>
  </div>
  <nav class="adm-bottom">
    <a href="index.html"><span class="ico">🏠</span>Início</a>
    <a href="produtos.html" class="active"><span class="ico">📦</span>Produtos</a>
    <a href="pedidos.html"><span class="ico">📋</span>Pedidos</a>
    <a href="#" onclick="toggleMenu();return false"><span class="ico">⋯</span>Mais</a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/lodjastore/js/supabase-config.js"></script>
  <script src="/lodjastore/js/admin-auth.js"></script>
  <script src="/lodjastore/js/loja-storage.js"></script>
  <script>
    if (!AdminAuth.require()) throw 0;
    function toggleMenu(){ document.getElementById("drawer").classList.toggle("open"); }
    let editId = null;
    let imagensUpload = [];
    function renderImgs() {
      const el = document.getElementById('imgPreview');
      if (!el) return;
      el.innerHTML = imagensUpload.map((im, i) =>
        '<div class="img-upload-item"><img src="'+im.url+'" alt=""><button type="button" onclick="imagensUpload.splice('+i+',1);renderImgs()">✕</button></div>'
      ).join('');
    }
    document.addEventListener('change', async (e) => {
      if (e.target && e.target.id === 'fFiles') {
        for (const f of [...e.target.files]) {
          try {
            const url = await LojaDB.readFileAsDataURL(f);
            imagensUpload.push({ url, ordem: imagensUpload.length, tipo: imagensUpload.length ? 'secundaria' : 'principal' });
          } catch (err) { alert(err.message); }
        }
        if (imagensUpload[0]) imagensUpload[0].tipo = 'principal';
        renderImgs();
        e.target.value = '';
      }
    });
    function novo() {
      editId = null;
      document.getElementById('formBox').style.display = 'block';
      document.getElementById('formTitle').textContent = 'Novo produto';
      imagensUpload = []; renderImgs();
      ['fNome','fCodigo','fDesc','fPreco','fPromo','fImg1','fImg2','fTam','fCor','fId'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('fDest').checked = false;
      document.getElementById('fTend').checked = false;
    }
    async function guardar() {
      const nome = document.getElementById('fNome').value.trim();
      if (!nome) return alert('Nome obrigatório');
      const tams = document.getElementById('fTam').value.split(',').map(s=>s.trim()).filter(Boolean);
      const cores = document.getElementById('fCor').value.split(',').map(s=>s.trim()).filter(Boolean);
      const variacoes = [];
      (tams.length ? tams : ['Único']).forEach(t => {
        (cores.length ? cores : ['Padrão']).forEach(c => {
          variacoes.push({ tamanho: t, cor: c, stock: 5 });
        });
      });
      let imgs = imagensUpload.slice();
      const u1 = document.getElementById('fImg1').value.trim();
      const u2 = document.getElementById('fImg2').value.trim();
      if (u1) imgs.push({ url: u1, ordem: imgs.length, tipo: imgs.length ? 'secundaria' : 'principal' });
      if (u2) imgs.push({ url: u2, ordem: imgs.length, tipo: 'secundaria' });
      if (!imgs.length) { alert('Adicione pelo menos 1 imagem (ficheiro ou URL)'); return; }
      imgs[0].tipo = 'principal';
      const prod = {
        id: editId || undefined,
        nome,
        codigo: document.getElementById('fCodigo').value.trim(),
        descricao: document.getElementById('fDesc').value.trim(),
        preco: parseFloat(document.getElementById('fPreco').value) || 0,
        preco_promocional: document.getElementById('fPromo').value ? parseFloat(document.getElementById('fPromo').value) : null,
        destaque: document.getElementById('fDest').checked,
        tendencia: document.getElementById('fTend').checked,
        estado: 'activo',
        categoria_id: (document.getElementById('fCat') && document.getElementById('fCat').value) || 'cat_vest',
        imagens: imgs,
        variacoes
      };
      await LojaDB.saveProduto(prod);
      document.getElementById('formBox').style.display = 'none';
      render();
    }
    async function editar(id) {
      const p = await LojaDB.getProduto(id);
      if (!p) return;
      editId = p.id;
      document.getElementById('formBox').style.display = 'block';
      document.getElementById('formTitle').textContent = 'Editar produto';
      document.getElementById('fNome').value = p.nome || '';
      document.getElementById('fCodigo').value = p.codigo || '';
      if (document.getElementById('fCat') && p.categoria_id) document.getElementById('fCat').value = p.categoria_id;
      document.getElementById('fDesc').value = p.descricao || '';
      document.getElementById('fPreco').value = p.preco || 0;
      document.getElementById('fPromo').value = p.preco_promocional || '';
      imagensUpload = (p.imagens || []).filter(im => im.url && String(im.url).startsWith('data:')).map((im,i)=>({...im,ordem:i}));
      renderImgs();
      const urlImgs = (p.imagens || []).filter(im => im.url && !String(im.url).startsWith('data:'));
      document.getElementById('fImg1').value = urlImgs[0] ? urlImgs[0].url : '';
      document.getElementById('fImg2').value = urlImgs[1] ? urlImgs[1].url : '';
      document.getElementById('fTam').value = [...new Set((p.variacoes||[]).map(v=>v.tamanho))].join(',');
      document.getElementById('fCor').value = [...new Set((p.variacoes||[]).map(v=>v.cor))].join(',');
      document.getElementById('fDest').checked = !!p.destaque;
      document.getElementById('fTend').checked = !!p.tendencia;
    }
    async function apagar(id) {
      if (!confirm('Remover este produto?')) return;
      await LojaDB.deleteProduto(id);
      render();
    }
    async function render() {
      const list = await LojaDB.getProdutos({});
      document.getElementById('lista').innerHTML = `
        <thead><tr><th>Produto</th><th>Preço</th><th>Flags</th><th></th></tr></thead>
        <tbody>${list.map(p => `<tr>
          <td><strong>${(p.nome||'').replace(/</g,'&lt;')}</strong><br><span style="color:var(--muted);font-size:12px">${p.codigo||''}</span></td>
          <td>${LojaDB.formatMT(LojaDB.precoFinal(p))}</td>
          <td>${p.destaque?'⭐':''} ${p.tendencia?'🔥':''}</td>
          <td>
            <button class="btn btn-sm btn-outline" onclick="editar('${p.id}')">Editar</button>
            <button class="btn btn-sm btn-outline" onclick="apagar('${p.id}')">Apagar</button>
          </td>
        </tr>`).join('')}</tbody>`;
    }
    async function loadCats() {
      const cats = await LojaDB.getCategorias();
      const sel = document.getElementById('fCat');
      if (!sel) return;
      sel.innerHTML = cats.map(c => '<option value="'+c.id+'">'+(c.nome||'')+'</option>').join('')
        || '<option value="cat_vest">Vestuário</option>';
    }
    (async () => { initSupabase(); await LojaDB.init(); await loadCats(); render(); })();
  </script>

</body>
</html>
