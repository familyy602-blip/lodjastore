<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/lodjastore/css/loja.css">
  <link rel="icon" href="/lodjastore/logo-lodja.png">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #eef2ff, #f8fafc);
      font-family: Inter, system-ui, sans-serif;
      display: flex; flex-direction: column;
    }
    .login-wrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px 48px;
    }
    .login-card {
      width: min(400px, 100%);
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 12px 40px rgba(15,23,42,.08);
      text-align: center;
    }
    .login-card img.brand {
      width: 64px; height: 64px; border-radius: 50%;
      object-fit: cover; margin: 0 auto 12px; display: block;
    }
    .login-card h1 { font-size: 1.25rem; margin: 0 0 4px; color: #0f172a; }
    .login-card .site-name {
      margin: 0 0 20px; color: #64748b; font-weight: 600; font-size: 14px;
    }
    .login-card label {
      display: block; text-align: left; font-size: 13px; font-weight: 600;
      color: #64748b; margin-bottom: 6px;
    }
    .pass-wrap { position: relative; margin-bottom: 16px; }
    .pass-wrap input {
      width: 100%; padding: 12px 44px 12px 14px; border: 1px solid #e2e8f0;
      border-radius: 12px; font-size: 15px; box-sizing: border-box;
    }
    .pass-toggle {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      border: none; background: transparent; cursor: pointer; font-size: 18px;
      padding: 4px 6px; opacity: .7;
    }
    .btn-login {
      width: 100%; padding: 12px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff; font-weight: 700; font-size: 15px; cursor: pointer;
    }
    .btn-login:hover { filter: brightness(1.05); }
    .back-link {
      display: inline-block; margin: 16px 0 0; color: #64748b;
      font-size: 13px; font-weight: 600; text-decoration: none;
    }
    .err { color: #ef4444; font-size: 13px; margin: 8px 0; min-height: 18px; }
  </style>
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('lv_settings') || '{}');
        window.__LV_BRAND = { name: s.siteName || '', logo: s.logoUrl || '' };
        if (s.logoUrl) {
          var l = document.createElement('link');
          l.rel = 'icon'; l.href = s.logoUrl;
          document.head.appendChild(l);
        }
      } catch (e) { window.__LV_BRAND = { name: '', logo: '' }; }
    })();
  </script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <img class="brand" id="adminBrandLogo" src="/lodjastore/logo-lodja.png" alt="">
      <h1>Painel administrativo</h1>
      <p class="site-name" id="loginSiteName"></p>
      <form id="loginForm" onsubmit="return doLogin(event)">
        <label for="pass">Palavra-passe</label>
        <div class="pass-wrap">
          <input type="password" id="pass" autocomplete="current-password" required>
          <button type="button" class="pass-toggle" onclick="togglePass()" aria-label="Mostrar">👁</button>
        </div>
        <p class="err" id="err"></p>
        <button type="submit" class="btn-login">Entrar</button>
      </form>
      <a class="back-link" href="/lodjastore/index.html">← Voltar à loja</a>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/lodjastore/js/supabase-config.js"></script>
  <script src="/lodjastore/js/loja-storage.js"></script>
  <script src="/lodjastore/js/admin-auth.js"></script>
  <script>
    (function () {
      var b = window.__LV_BRAND || {};
      if (b.logo) {
        var img = document.getElementById('adminBrandLogo');
        if (img) { img.onerror = function () {}; img.src = b.logo; }
      }
      if (b.name) {
        document.getElementById('loginSiteName').textContent = b.name;
      }
    })();
    function togglePass() {
      var i = document.getElementById('pass');
      i.type = i.type === 'password' ? 'text' : 'password';
    }
    async function doLogin(e) {
      e.preventDefault();
      document.getElementById('err').textContent = '';
      try {
        if (typeof initSupabase === 'function') initSupabase();
        if (typeof LojaDB !== 'undefined') await LojaDB.init();
        var ok = await AdminAuth.login(document.getElementById('pass').value);
        if (ok) location.href = 'index.html';
        else document.getElementById('err').textContent = 'Palavra-passe incorrecta.';
      } catch (err) {
        document.getElementById('err').textContent = err.message || 'Erro ao entrar.';
      }
      return false;
    }
    if (typeof AdminAuth !== 'undefined' && AdminAuth.isLoggedIn && AdminAuth.isLoggedIn()) {
      location.href = 'index.html';
    }
  </script>
</body>
</html>
