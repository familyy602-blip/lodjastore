<!DOCTYPE html>
<html lang="pt">
<head>
  <!-- CSS embutido: funciona no GitHub Pages mesmo se css/ falhar -->
  <style id="loja-css-inline">
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --text: #0f172a;
  --muted: #64748b;
  --primary: #4f46e5;
  --primary-dark: #3730a3;
  --accent: #f59e0b;
  --success: #10b981;
  --danger: #ef4444;
  --border: #e2e8f0;
  --radius: 14px;
  --shadow: 0 8px 24px rgba(15, 23, 42, .08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; }

.container { width: min(1120px, 100% - 32px); margin: 0 auto; }

/* Header */
.site-header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  display: flex; align-items: center; gap: 16px;
  padding: 12px 0; justify-content: space-between;
}
.logo {
  display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.15rem;
}
.logo-mark {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  color: #fff; display: grid; place-items: center; font-weight: 800;
}
.nav-links { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.nav-links a, .nav-links button {
  padding: 8px 12px; border-radius: 10px; border: none; background: transparent;
  color: var(--muted); font-weight: 600; cursor: pointer;
}
.nav-links a:hover, .nav-links a.active { background: #eef2ff; color: var(--primary); }
.icon-btn {
  position: relative; width: 42px; height: 42px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface);
  display: grid; place-items: center; cursor: pointer;
}
.badge-count {
  position: absolute; top: -4px; right: -4px;
  background: var(--danger); color: #fff; font-size: 11px; font-weight: 700;
  min-width: 18px; height: 18px; border-radius: 99px; display: grid; place-items: center;
  padding: 0 4px;
}

/* Hero */
.hero {
  margin: 20px 0 28px;
  background: linear-gradient(135deg, #eef2ff 0%, #fdf4ff 50%, #fff7ed 100%);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 28px 24px;
  display: grid; gap: 12px;
}
.hero h1 { font-size: clamp(1.5rem, 4vw, 2.1rem); line-height: 1.2; }
.hero p { color: var(--muted); max-width: 520px; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 18px; border-radius: 12px; border: none; font-weight: 700;
  cursor: pointer; transition: .15s ease;
}
.btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; }
.btn-primary:hover { filter: brightness(1.05); transform: translateY(-1px); }
.btn-outline { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.btn-accent { background: var(--accent); color: #111; }
.btn-sm { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
.btn-block { width: 100%; }
.btn:disabled { opacity: .55; cursor: not-allowed; }

/* Sections */
.section { margin: 28px 0; }
.section-head {
  display: flex; justify-content: space-between; align-items: end; gap: 12px;
  margin-bottom: 14px;
}
.section-head h2 { font-size: 1.25rem; }
.section-head span { color: var(--muted); font-size: 14px; }

/* Product grid */
.grid-produtos {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 14px;
}
@media (min-width: 640px) {
  .grid-produtos { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
}
.card-prod {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
  transition: transform .15s ease;
}
.card-prod:hover { transform: translateY(-3px); }
.card-prod .thumb {
  aspect-ratio: 4/5; background: #f1f5f9; position: relative; overflow: hidden;
}
.card-prod .thumb img { width: 100%; height: 100%; object-fit: cover; }
.badge-promo {
  position: absolute; top: 10px; left: 10px;
  background: var(--danger); color: #fff; font-size: 11px; font-weight: 800;
  padding: 4px 8px; border-radius: 8px;
}
.card-body { padding: 12px; }
.card-body h3 { font-size: 14px; font-weight: 700; margin-bottom: 6px; line-height: 1.3; }
.preco { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.preco .now { font-weight: 800; color: var(--primary-dark); }
.preco .old { text-decoration: line-through; color: var(--muted); font-size: 13px; }

/* Chips categorias */
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 18px; }
.chip {
  padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface); font-weight: 600; font-size: 13px; cursor: pointer;
}
.chip.active, .chip:hover { background: #eef2ff; border-color: #c7d2fe; color: var(--primary); }

/* Promo timer */
.promo-banner {
  background: #0f172a; color: #fff; border-radius: 16px; padding: 16px 18px;
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.promo-banner .timer {
  display: flex; gap: 8px; font-weight: 800; font-variant-numeric: tabular-nums;
}
.promo-banner .timer span {
  background: rgba(255,255,255,.12); padding: 8px 10px; border-radius: 10px; min-width: 52px; text-align: center;
}

/* Product page */
.prod-layout {
  display: grid; gap: 24px; margin: 20px 0 40px;
}
@media (min-width: 800px) {
  .prod-layout { grid-template-columns: 1.1fr 1fr; align-items: start; }
}
.gallery { display: grid; gap: 10px; }
.gallery-main {
  aspect-ratio: 4/5; border-radius: 18px; overflow: hidden; background: #f1f5f9; border: 1px solid var(--border);
}
.gallery-main img { width: 100%; height: 100%; object-fit: cover; }
.gallery-thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.gallery-thumbs button {
  width: 64px; height: 64px; border-radius: 12px; overflow: hidden; border: 2px solid transparent;
  padding: 0; cursor: pointer; background: #f1f5f9;
}
.gallery-thumbs button.active { border-color: var(--primary); }
.gallery-thumbs img { width: 100%; height: 100%; object-fit: cover; }
.opts { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 14px; }
.opt {
  min-width: 44px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); cursor: pointer; font-weight: 600;
}
.opt.selected { border-color: var(--primary); background: #eef2ff; color: var(--primary); }
.qty-row { display: flex; align-items: center; gap: 10px; margin: 12px 0 18px; }
.qty-row button {
  width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: #fff; font-size: 18px; cursor: pointer;
}
.qty-row span { min-width: 28px; text-align: center; font-weight: 700; }
.actions-row { display: grid; gap: 10px; }

/* Cart / checkout */
.table-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
}
.cart-item {
  display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; padding: 14px;
  border-bottom: 1px solid var(--border); align-items: center;
}
.cart-item img { width: 72px; height: 90px; object-fit: cover; border-radius: 10px; background: #f1f5f9; }
.cart-item .meta { color: var(--muted); font-size: 13px; }
.summary {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px;
  position: sticky; top: 80px;
}
.summary .line { display: flex; justify-content: space-between; margin: 8px 0; color: var(--muted); }
.summary .total { font-size: 1.2rem; font-weight: 800; color: var(--text); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.form-control {
  width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border);
  background: #fff;
}
.form-control:focus { outline: none; border-color: #818cf8; box-shadow: 0 0 0 3px rgba(99,102,241,.2); }

/* Footer */
.site-footer {
  margin-top: 48px; padding: 28px 0; border-top: 1px solid var(--border); color: var(--muted); font-size: 14px;
}
.footer-inner { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; }

/* Admin */
.admin-layout { display: grid; min-height: 100vh; }
@media (min-width: 900px) {
  .admin-layout { grid-template-columns: 240px 1fr; }
}
.admin-side {
  background: #0f172a; color: #e2e8f0; padding: 20px 14px;
}
.admin-side a {
  display: block; padding: 10px 12px; border-radius: 10px; color: #94a3b8; font-weight: 600; margin-bottom: 4px;
}
.admin-side a:hover, .admin-side a.active { background: rgba(99,102,241,.25); color: #fff; }
.admin-main { padding: 20px; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin: 16px 0; }
.stat {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px;
}
.stat .l { font-size: 12px; color: var(--muted); }
.stat .v { font-size: 1.4rem; font-weight: 800; margin-top: 4px; }
table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
table.data th, table.data td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; }
table.data th { background: #f8fafc; font-size: 12px; color: var(--muted); }
.badge-estado {
  display: inline-block; padding: 4px 8px; border-radius: 8px; font-size: 12px; font-weight: 700;
  background: #e2e8f0;
}
.badge-estado.pendente { background: #fef3c7; color: #92400e; }
.badge-estado.confirmado, .badge-estado.pago { background: #dbeafe; color: #1e40af; }
.badge-estado.concluido, .badge-estado.entregue { background: #d1fae5; color: #065f46; }
.badge-estado.cancelado { background: #fee2e2; color: #991b1b; }

.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: #0f172a; color: #fff; padding: 12px 18px; border-radius: 12px;
  z-index: 100; font-weight: 600; box-shadow: var(--shadow);
}
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }


/* Incremental: botão Voltar e admin focado */
.btn-voltar {
  display: inline-flex; align-items: center; gap: 6px;
  background: linear-gradient(135deg, #64748b, #475569);
  color: #fff !important; border: none; font-weight: 700;
  padding: 8px 14px; border-radius: 10px; cursor: pointer; text-decoration: none;
  box-shadow: 0 2px 8px rgba(15,23,42,.12);
}
.btn-voltar:hover { filter: brightness(1.08); color: #fff !important; }
.btn-orange {
  display: inline-flex; align-items: center; gap: 6px;
  background: linear-gradient(135deg, #f97316, #ea580c);
  color: #fff !important; border: none; font-weight: 700;
  padding: 8px 14px; border-radius: 10px; cursor: pointer; text-decoration: none;
}
.btn-orange:hover { filter: brightness(1.06); color: #fff !important; }
.catalogo-search {
  width: 100%; max-width: 100%; margin: 0 0 12px;
}
.catalogo-toolbar {
  display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px;
}
@media (min-width: 640px) {
  .catalogo-toolbar { flex-direction: row; align-items: center; justify-content: space-between; }
  .catalogo-search { max-width: 280px; }
}
.admin-topbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
}
.admin-topbar h1 { margin: 0; font-size: 1.25rem; flex: 1; min-width: 120px; }
.admin-page .admin-side { display: none !important; }
.admin-page .admin-layout { display: block; }
.admin-page .admin-main { max-width: 960px; margin: 0 auto; padding: 16px; width: 100%; }
.bonus-destaque {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
  background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff;
  border-radius: 16px; padding: 16px; margin: 12px 0 18px;
}
.bonus-destaque .btn { background: #fff; color: #4f46e5; font-weight: 700; }
@media (max-width: 640px) {
  .admin-main { padding: 12px !important; }
  table.data { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .stat-grid { grid-template-columns: repeat(2, 1fr) !important; }
}

.upload-zone {
  border: 2px dashed #c7d2fe; border-radius: 14px; padding: 14px; text-align: center;
  background: #f8fafc; cursor: pointer; color: var(--muted); font-size: 14px;
}
.upload-zone:hover { border-color: var(--primary); color: var(--primary); }
.img-upload-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.img-upload-item {
  position: relative; width: 88px; height: 88px; border-radius: 12px; overflow: hidden;
  border: 1px solid var(--border); background: #f1f5f9;
}
.img-upload-item img { width: 100%; height: 100%; object-fit: cover; }
.img-upload-item button {
  position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border: none;
  border-radius: 50%; background: rgba(15,23,42,.75); color: #fff; cursor: pointer;
}
.logo { display: flex; align-items: center; gap: 10px; }


/* Voltar sempre visível e sólido */

}


/* Voltar no canto superior esquerdo (igual ao login admin) */
.page-voltar {
  padding: 16px;
  margin: 0;

  width: 100%;
  box-sizing: border-box;

}
.page-voltar .btn-voltar {
  display: inline-flex !important;

}

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <link rel="stylesheet" href="/lodjastore/css/loja.css">
  <link rel="icon" href="/lodjastore/logo-lodja.png">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    .chart-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin: 16px 0;
    }
    @media (min-width: 800px) {
      .chart-grid { grid-template-columns: 1fr 1fr; }
    }
    .chart-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 4px 14px rgba(15,23,42,.04);

    .chart-card h3 { margin: 0 0 10px; font-size: .95rem; }

<body class="admin-page">
  <div class="page-voltar">
    <a class="btn-voltar" href="index.html">← Voltar</a>
  </div>

  <div class="admin-layout">
    <main class="admin-main">
      <h1 class="admin-page-title">Relatórios</h1>
      <p style="color:var(--muted);font-size:13px;margin-bottom:12px">Métricas da loja virtual — vendas, tendências e sincronização LODJA.</p>

      <div class="stat-grid" id="stats"></div>

      <div style="display:flex;flex-wrap:wrap;gap:8px;margin:16px 0">
        <button class="btn btn-primary" type="button" onclick="exportExcel()">📥 Excel</button>
        <button class="btn btn-outline" type="button" onclick="exportPDF()">📄 PDF</button>
        <button class="btn btn-outline" type="button" onclick="exportWord()">📝 Word</button>
      </div>

      <div class="chart-grid">
        <div class="chart-card">
          <h3>Vendas por dia (últimos 14 dias)</h3>
          <div class="chart-wrap"><canvas id="chartVendas"></canvas></div>
        </div>
        <div class="chart-card">
          <h3>Pedidos por estado</h3>
          <div class="chart-wrap"><canvas id="chartEstados"></canvas></div>
        </div>
        <div class="chart-card">
          <h3>Top produtos (quantidade)</h3>
          <div class="chart-wrap"><canvas id="chartTop"></canvas></div>
        </div>
        <div class="chart-card">
          <h3>Receita por categoria</h3>
          <div class="chart-wrap"><canvas id="chartCats"></canvas></div>
        </div>
      </div>

      <h2 style="font-size:1rem;margin:16px 0 8px">Produtos por categoria</h2>
      <div class="table-card" style="overflow:auto"><table class="data" id="tabCat"></table></div>
      <h2 style="font-size:1rem;margin:16px 0 8px">Pedidos recentes</h2>
      <div class="table-card" style="overflow:auto"><table class="data" id="tabPed"></table></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/lodjastore/js/supabase-config.js"></script>
  <script src="/lodjastore/js/admin-auth.js"></script>
  <script src="/lodjastore/js/loja-storage.js"></script>
  <script>
    if (!AdminAuth.require()) throw 0;
    let produtos = [], pedidos = [], cats = [], topMap = {}, charts = {};

    function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

    function dayKey(d) {
      const x = new Date(d);
      if (isNaN(x)) return null;
      return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0');
    }

    function buildCharts() {
      Object.values(charts).forEach(c => { try { c.destroy(); } catch(e){} });
      charts = {};

      // Vendas 14 dias
      const days = [];
      const now = new Date();
      for (let i = 13; i >= 0; i--) {
        const d = new Date(now); d.setDate(now.getDate() - i);
        days.push(dayKey(d));
      }
      const vendasDia = {};
      days.forEach(k => vendasDia[k] = 0);
      pedidos.forEach(p => {
        if (['cancelado'].includes(p.estado)) return;
        const k = dayKey(p.data_criacao);
        if (k && vendasDia[k] != null) vendasDia[k] += Number(p.total) || 0;
      });
      charts.vendas = new Chart(document.getElementById('chartVendas'), {
        type: 'line',
        data: {
          labels: days.map(k => k.slice(5)),
          datasets: [{
            label: 'MT',
            data: days.map(k => vendasDia[k]),
            borderColor: '#4f46e5',
            backgroundColor: 'rgba(79,70,229,.15)',
            fill: true,
            tension: .3
          }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
      });

      // Estados
      const estCount = {};
      pedidos.forEach(p => { estCount[p.estado || '?'] = (estCount[p.estado || '?'] || 0) + 1; });
      const estLabels = Object.keys(estCount);
      const colors = ['#6366f1','#22c55e','#f59e0b','#ef4444','#06b6d4','#8b5cf6','#94a3b8','#ec4899','#14b8a6','#a3e635','#f97316'];
      charts.estados = new Chart(document.getElementById('chartEstados'), {
        type: 'doughnut',
        data: {
          labels: estLabels,
          datasets: [{ data: estLabels.map(k => estCount[k]), backgroundColor: estLabels.map((_,i) => colors[i % colors.length]) }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });

      // Top produtos
      const top = Object.entries(topMap).sort((a,b)=>b[1]-a[1]).slice(0, 8);
      charts.top = new Chart(document.getElementById('chartTop'), {
        type: 'bar',
        data: {
          labels: top.map(([n]) => n.length > 18 ? n.slice(0,16)+'…' : n),
          datasets: [{ label: 'Qtd', data: top.map(([,q]) => q), backgroundColor: '#8b5cf6' }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, indexAxis: 'y' }
      });

      // Receita por categoria (aprox via produto.categoria_id nos itens se existir)
      const catRev = {};
      const prodById = {};
      produtos.forEach(p => { prodById[p.id] = p; });
      cats.forEach(c => { catRev[c.nome || c.id] = 0; });
      catRev['Outros'] = 0;
      pedidos.forEach(p => {
        if (p.estado === 'cancelado') return;
        (p.itens || []).forEach(it => {
          const prod = prodById[it.produtoId || it.produto_id];
          let nome = 'Outros';
          if (prod) {
            const c = cats.find(x => x.id === prod.categoria_id);
            nome = c ? c.nome : 'Outros';
          }
          catRev[nome] = (catRev[nome] || 0) + (Number(it.preco)||0) * (Number(it.quantidade)||1);
        });
      });
      const catLabels = Object.keys(catRev).filter(k => catRev[k] > 0);
      charts.cats = new Chart(document.getElementById('chartCats'), {
        type: 'pie',
        data: {
          labels: catLabels.length ? catLabels : ['Sem dados'],
          datasets: [{
            data: catLabels.length ? catLabels.map(k => catRev[k]) : [1],
            backgroundColor: catLabels.map((_,i) => colors[i % colors.length])
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    async function load() {
      initSupabase(); await LojaDB.init();
      produtos = await LojaDB.getProdutos({});
      pedidos = await LojaDB.getPedidos();
      cats = await LojaDB.getAllCategorias();

      const pend = pedidos.filter(p => p.estado === 'pendente').length;
      const vendas = pedidos.filter(p => ['concluido','entregue','pago'].includes(p.estado))
        .reduce((s,p) => s + (Number(p.total)||0), 0);
      const ticket = (() => {
        const ok = pedidos.filter(p => ['concluido','entregue','pago'].includes(p.estado));
        if (!ok.length) return 0;
        return Math.round(ok.reduce((s,p)=>s+(Number(p.total)||0),0) / ok.length);
      })();
      const syncN = pedidos.filter(p => p.lodja_sync || localStorage.getItem('lv_sync_'+p.numero_pedido)==='ok').length;

      document.getElementById('stats').innerHTML = `
        <div class="stat"><div class="l">Produtos</div><div class="v">${produtos.length}</div></div>
        <div class="stat"><div class="l">Pedidos</div><div class="v">${pedidos.length}</div></div>
        <div class="stat"><div class="l">Pendentes</div><div class="v">${pend}</div></div>
        <div class="stat"><div class="l">Vendas MT</div><div class="v">${vendas.toLocaleString('pt-PT')}</div></div>
        <div class="stat"><div class="l">Valor médio</div><div class="v">${ticket.toLocaleString('pt-PT')}</div></div>
        <div class="stat"><div class="l">Sync LODJA</div><div class="v">${syncN}</div></div>`;

      document.getElementById('tabCat').innerHTML = `<thead><tr><th>Categoria</th><th>Produtos</th><th>Estado</th></tr></thead>
        <tbody>${cats.map(c => {
          const n = produtos.filter(p => p.categoria_id === c.id).length;
          return `<tr><td>${esc(c.nome)}</td><td>${n}</td><td>${esc(c.estado)}</td></tr>`;
        }).join('') || '<tr><td colspan="3">—</td></tr>'}</tbody>`;

      document.getElementById('tabPed').innerHTML = `<thead><tr><th>Nº</th><th>Cliente</th><th>Total</th><th>Estado</th><th>LODJA</th></tr></thead>
        <tbody>${pedidos.slice(0,25).map(p => {
          const sync = p.lodja_sync || localStorage.getItem('lv_sync_'+p.numero_pedido)==='ok';
          return `<tr>
          <td>${esc(p.numero_pedido)}</td><td>${esc(p.cliente_nome)}</td>
          <td>${LojaDB.formatMT(p.total)}</td><td>${esc(p.estado)}</td>
          <td>${p.lodja_cliente?'Cliente':'-'} ${sync?'· Compra':''}</td></tr>`;
        }).join('') || '<tr><td colspan="5">—</td></tr>'}</tbody>`;

      topMap = {};
      pedidos.forEach(p => (p.itens || []).forEach(i => {
        const k = i.nome || i.produtoId || '?';
        topMap[k] = (topMap[k] || 0) + (i.quantidade || 1);
      }));

      buildCharts();
    }

    function exportExcel() {
      const wb = XLSX.utils.book_new();
      const vendas = pedidos.filter(p => ['concluido','entregue','pago'].includes(p.estado))
        .reduce((s,p) => s + (Number(p.total)||0), 0);
      const s1 = [
        ['Relatório LODJA Store', new Date().toLocaleString('pt-PT')],
        [],
        ['Métrica', 'Valor'],
        ['Produtos', produtos.length],
        ['Pedidos', pedidos.length],
        ['Vendas (pago/entregue/concluído) MT', vendas],
        [],
        ['Categoria', 'Nº produtos'],
        ...cats.map(c => [c.nome, produtos.filter(p=>p.categoria_id===c.id).length]),
        [],
        ['Produto (tendência)', 'Quantidade'],
        ...Object.entries(topMap).sort((a,b)=>b[1]-a[1]).map(([n,q]) => [n,q]),
        [],
        ['Nº pedido', 'Cliente', 'Telefone', 'Total', 'Estado', 'Cliente LODJA', 'Data'],
        ...pedidos.map(p => [p.numero_pedido, p.cliente_nome, p.cliente_telefone, p.total, p.estado, p.lodja_cliente?'sim':'não', p.data_criacao])
      ];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s1), 'Dashboard');
      XLSX.writeFile(wb, 'relatorio-loja-' + Date.now() + '.xlsx');
    }

    function docHtml() {
      const top = Object.entries(topMap).sort((a,b)=>b[1]-a[1]).slice(0,10)
        .map(([n,q]) => `<tr><td>${esc(n)}</td><td>${q}</td></tr>`).join('');
      const vendas = pedidos.filter(p => ['concluido','entregue','pago'].includes(p.estado))
        .reduce((s,p) => s + (Number(p.total)||0), 0);
      return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Relatório</title>
        <style>body{font-family:Arial,sans-serif;padding:24px;color:#111}
        h1{font-size:20px} table{border-collapse:collapse;width:100%;margin:12px 0}
        th,td{border:1px solid #ccc;padding:8px;text-align:left;font-size:13px}
        th{background:#f1f5f9}</style></head><body>
        <h1>Relatório LODJA Store</h1>
        <p>Gerado em ${new Date().toLocaleString('pt-PT')}</p>
        <p><strong>Produtos:</strong> ${produtos.length} · <strong>Pedidos:</strong> ${pedidos.length} · <strong>Vendas MT:</strong> ${vendas}</p>
        <h2>Tendências (top produtos)</h2>
        <table><thead><tr><th>Produto</th><th>Qtd</th></tr></thead><tbody>${top}</tbody></table>
        <h2>Pedidos</h2>
        <table><thead><tr><th>Nº</th><th>Cliente</th><th>Total</th><th>Estado</th></tr></thead>
        <tbody>${pedidos.slice(0,50).map(p=>`<tr><td>${esc(p.numero_pedido)}</td><td>${esc(p.cliente_nome)}</td>
          <td>${p.total||0}</td><td>${esc(p.estado)}</td></tr>`).join('')}</tbody></table>
        </body></html>`;
    }
    function exportPDF() {
      const w = window.open('', '_blank');
      w.document.write(docHtml());
      w.document.close();
      setTimeout(() => w.print(), 400);
    }
    function exportWord() {
      const blob = new Blob(['\ufeff' + docHtml()], { type: 'application/msword' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'relatorio-loja-' + Date.now() + '.doc';
      a.click();
    }

    load();
  </script>
</body>
</html>
