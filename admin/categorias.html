<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Categorias — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/lodjastore/css/loja.css">
  <link rel="stylesheet" href="/lodjastore/css/admin-ui.css">
  <link rel="icon" href="/lodjastore/logo-lodja.png">
</head>
<body class="admin-pro">
  <header class="adm-top">
    <div class="adm-top-row">
      <div class="adm-brand">
        <button type="button" class="adm-icon-btn" onclick="toggleMenu()">☰</button>
        <div><strong>Categorias</strong><small>Gestão do catálogo</small></div>
      </div>
      <div class="adm-top-actions">
        <a class="adm-icon-btn" href="index.html">🏠</a>
      </div>
    </div>
  </header>
  <div class="adm-drawer" id="drawer">
    <div class="scrim" onclick="toggleMenu()"></div>
    <div class="panel">
      <a href="index.html">📊 Dashboard</a>
      <a href="produtos.html">👕 Produtos</a>
      <a href="categorias.html" class="active">📂 Categorias</a>
      <a href="pedidos.html">📦 Pedidos</a>
      <a href="relatorios.html">📈 Relatórios</a>
      <a href="promocoes.html">🏷️ Promoções</a>
      <a href="configuracoes.html">⚙️ Configurações</a>
      <a href="/lodjastore/index.html">🏠 Ver loja</a>
      <a href="#" onclick="if(confirm('Sair?'))AdminAuth.logout();return false">🚪 Sair</a>
    </div>
  </div>
  <div class="adm-shell">
    <a class="adm-back" href="index.html">← Voltar</a>
    <div class="adm-page-head">
      <div class="ico">▦</div>
      <div>
        <h1>Categorias</h1>
        <p>Gerencie as categorias dos seus produtos.</p>
      </div>
    </div>
    <div class="adm-actions-row">
      <button type="button" class="adm-btn adm-btn-primary" onclick="novo()">+ Nova categoria</button>
    </div>
    <div class="adm-toolbar">
      <div class="adm-search"><span>🔍</span><input id="q" placeholder="Pesquisar categoria…" oninput="load()"></div>
      <select class="adm-select" id="fEst" onchange="load()">
        <option value="">Todos</option>
        <option value="activo">Activo</option>
        <option value="inactivo">Inactivo</option>
      </select>
    </div>
    <div id="formBox" class="adm-card" style="display:none">
      <h3 style="margin:0 0 10px">Categoria</h3>
      <div class="form-group"><label>Nome *</label><input class="form-control" id="cNome"></div>
      <div class="form-group"><label>Descrição</label><textarea class="form-control" id="cDesc" rows="2"></textarea></div>
      <div class="form-group"><label>Estado</label>
        <select class="form-control" id="cEstado"><option value="activo">activo</option><option value="inactivo">inactivo</option></select>
      </div>
      <input type="hidden" id="cId">
      <div style="display:flex;gap:8px;margin-top:10px">
        <button type="button" class="adm-btn adm-btn-primary" onclick="guardar()">Guardar</button>
        <button type="button" class="adm-btn adm-btn-ghost" onclick="document.getElementById('formBox').style.display='none'">Cancelar</button>
      </div>
    </div>
    <div id="lista"></div>
  </div>
  <nav class="adm-bottom">
    <a href="index.html"><span class="ico">🏠</span>Início</a>
    <a href="produtos.html"><span class="ico">📦</span>Produtos</a>
    <a href="pedidos.html"><span class="ico">📋</span>Pedidos</a>
    <a href="categorias.html" class="active"><span class="ico">▦</span>Categorias</a>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/lodjastore/js/supabase-config.js"></script>
  <script src="/lodjastore/js/admin-auth.js"></script>
  <script src="/lodjastore/js/loja-storage.js"></script>
  <script>
    if (!AdminAuth.require()) throw 0;
    function toggleMenu(){ document.getElementById('drawer').classList.toggle('open'); }
    function esc(s){ return String(s||'').replace(/</g,'&lt;'); }
    const icons = ['👕','💎','👟','👜','🧢','⌚'];
    function novo(){
      document.getElementById('formBox').style.display='block';
      document.getElementById('cId').value='';
      document.getElementById('cNome').value='';
      document.getElementById('cDesc').value='';
      document.getElementById('cEstado').value='activo';
    }
    async function guardar(){
      const nome=document.getElementById('cNome').value.trim();
      if(!nome) return alert('Nome obrigatório');
      await LojaDB.saveCategoria({
        id: document.getElementById('cId').value||undefined,
        nome, descricao: document.getElementById('cDesc').value.trim(),
        estado: document.getElementById('cEstado').value
      });
      document.getElementById('formBox').style.display='none';
      load();
    }
    async function editar(id){
      const list = await LojaDB.getAllCategorias();
      const c = list.find(x=>x.id===id); if(!c) return;
      document.getElementById('formBox').style.display='block';
      document.getElementById('cId').value=c.id;
      document.getElementById('cNome').value=c.nome||'';
      document.getElementById('cDesc').value=c.descricao||'';
      document.getElementById('cEstado').value=c.estado||'activo';
    }
    async function apagar(id){
      if(!confirm('Eliminar esta categoria?')) return;
      await LojaDB.deleteCategoria(id); load();
    }
    async function load(){
      const q=(document.getElementById('q').value||'').toLowerCase();
      const fe=document.getElementById('fEst').value;
      let cats = await LojaDB.getAllCategorias();
      const prods = await LojaDB.getProdutos({});
      if(q) cats=cats.filter(c=>(c.nome||'').toLowerCase().includes(q));
      if(fe) cats=cats.filter(c=>(c.estado||'')===fe);
      document.getElementById('lista').innerHTML = cats.map((c,i)=>{
        const n=prods.filter(p=>p.categoria_id===c.id).length;
        const ok=(c.estado||'')==='activo';
        return `<article class="adm-card"><div class="adm-card-row">
          <div class="adm-thumb" style="display:grid;place-items:center;font-size:24px;background:${ok?'#ede9fe':'#f1f5f9'}">${icons[i%icons.length]}</div>
          <div class="adm-card-body">
            <h3>${esc(c.nome)}</h3>
            <div class="meta">${esc(c.descricao)||'—'}</div>
            <div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              <span class="adm-badge ${ok?'ok':'muted'}">● ${esc(c.estado||'—')}</span>
              <span class="meta"><strong>${n}</strong> produto(s)</span>
            </div>
          </div>
          <div class="adm-card-actions">
            <button type="button" class="adm-btn adm-btn-sm adm-btn-edit" onclick="editar('${c.id}')">✎ Editar</button>
            <button type="button" class="adm-btn adm-btn-sm adm-btn-del" onclick="apagar('${c.id}')">🗑 Eliminar</button>
          </div>
        </div></article>`;
      }).join('') || '<p style="text-align:center;color:#64748b;padding:20px">Sem categorias</p>';
    }
    (async()=>{ initSupabase(); await LojaDB.init(); load(); })();
  </script>
</body>
</html>
